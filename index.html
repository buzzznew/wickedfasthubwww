<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Video App</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="app">

    <!-- Feed -->
    <div id="feed" class="feed">

        <!-- Reel 1 -->
        <section class="reel active">

            <video
                class="video"
                src="assets/videos/reel1.mp4"
                autoplay
                muted
                loop
                playsinline>
            </video>

            <div class="gradient"></div>

            <div class="top-bar">

                <div class="logo">
                    Reels
                </div>

                <div class="top-icons">
                    <i class="fa-solid fa-camera"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>

            </div>

            <div class="right-menu">

                <button class="icon like-btn">
                    <i class="fa-regular fa-heart"></i>
                    <span>120K</span>
                </button>

                <button class="icon">
                    <i class="fa-regular fa-comment"></i>
                    <span>4.2K</span>
                </button>

                <button class="icon">
                    <i class="fa-solid fa-share"></i>
                    <span>Share</span>
                </button>

                <button class="icon">
                    <i class="fa-solid fa-bookmark"></i>
                </button>

            </div>

            <div class="bottom">

                <div class="profile-row">

                    <img
                        class="avatar"
                        src="assets/images/avatar1.jpg">

                    <div>

                        <div class="username">
                            @creator_one
                        </div>

                        <div class="caption">
                            Beautiful sunset 🌅
                        </div>

                    </div>

                    <button class="follow">
                        Follow
                    </button>

                </div>

                <div class="music">
                    <i class="fa-solid fa-music"></i>
                    Original Audio
                </div>

            </div>

            <div class="progress"></div>

        </section>

        <!-- Reel 2 -->
        <section class="reel">

            <video
                class="video"
                src="assets/videos/reel2.mp4"
                muted
                loop
                playsinline>
            </video>

            <div class="gradient"></div>

            <div class="right-menu">

                <button class="icon like-btn">
                    <i class="fa-regular fa-heart"></i>
                    <span>54K</span>
                </button>

                <button class="icon">
                    <i class="fa-regular fa-comment"></i>
                    <span>910</span>
                </button>

                <button class="icon">
                    <i class="fa-solid fa-share"></i>
                    <span>Share</span>
                </button>

            </div>

            <div class="bottom">

                <div class="profile-row">

                    <img
                        class="avatar"
                        src="assets/images/avatar2.jpg">

                    <div>

                        <div class="username">
                            @traveler
                        </div>

                        <div class="caption">
                            Mountains ❤️
                        </div>

                    </div>

                    <button class="follow">
                        Follow
                    </button>

                </div>

                <div class="music">
                    <i class="fa-solid fa-music"></i>
                    Chill Beats
                </div>

            </div>

            <div class="progress"></div>

        </section>

        <!-- Reel 3 -->
        <section class="reel">

            <video
                class="video"
                src="assets/videos/reel3.mp4"
                muted
                loop
                playsinline>
            </video>

            <div class="gradient"></div>

            <div class="right-menu">

                <button class="icon like-btn">
                    <i class="fa-regular fa-heart"></i>
                    <span>340K</span>
                </button>

                <button class="icon">
                    <i class="fa-regular fa-comment"></i>
                    <span>16K</span>
                </button>

                <button class="icon">
                    <i class="fa-solid fa-share"></i>
                    <span>Share</span>
                </button>

            </div>

            <div class="bottom">

                <div class="profile-row">

                    <img
                        class="avatar"
                        src="assets/images/avatar3.jpg">

                    <div>

                        <div class="username">
                            @nature
                        </div>

                        <div class="caption">
                            Explore the world 🌍
                        </div>

                    </div>

                    <button class="follow">
                        Follow
                    </button>

                </div>

                <div class="music">
                    <i class="fa-solid fa-music"></i>
                    Adventure Mix
                </div>

            </div>

            <div class="progress"></div>

        </section>

    </div>

    <!-- Bottom Navigation -->
    <nav class="nav">

        <button class="nav-btn active">
            <i class="fa-solid fa-house"></i>
        </button>

        <button class="nav-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>

        <button class="nav-btn">
            <i class="fa-solid fa-circle-plus"></i>
        </button>

        <button class="nav-btn">
            <i class="fa-solid fa-film"></i>
        </button>

        <button class="nav-btn">
            <i class="fa-solid fa-user"></i>
        </button>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
